<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Library App</title>
</head>
<body>
  <h2>Login</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>

  <h2>Books</h2>
  <button onclick="getBooks()">Get All Books</button>
  <ul id="bookList"></ul>

  <script>
    let token = "";

    async function login() {
    const response = await fetch("http://localhost:8080/authenticate", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      username: document.getElementById("username").value,
      password: document.getElementById("password").value
    })
    });

  if (response.ok) {
    const data = await response.json();
    console.log("Login response:", data)
    token = data["payload"].accessToken; // veya data.accessToken (backend ne döndürüyorsa)
    alert("Login successful! Token alındı: " + token);
  } else {
    alert("Login failed!");
  }
  }


    async function getBooks() {
      if (!token) {
        alert("Önce login olmalısın!");
        return;
      }

      const response = await fetch("http://localhost:8080/rest/api/book/getAllBooks", {
        method: "GET",
        headers: {
          "Authorization": "Bearer " + token
        }
      });

      if (response.ok) {
        const books = await response.json();
        const list = document.getElementById("bookList");
        list.innerHTML = "";
        books.forEach(book => {
          const li = document.createElement("li");
          li.textContent = book.title + " - " + book.author;
          list.appendChild(li);
        });
      } else {
        alert("Kitapları alamadım!");
      }
    }
  </script>
</body>
</html>
